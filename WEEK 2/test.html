<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
            color: #4CAF50;
        }

        #scoreboard {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid #4CAF50;
            background-color: #111111;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="scoreboard">Score: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">
        Use <strong>Arrow Keys</strong> or <strong>W, A, S, D</strong> to move.<br>
        Press <strong>Spacebar</strong> to Restart when game over.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let isGameOver = false;
        let changingDirection = false; // Prevents fast double-click self-collision

        // Start game loop
        startGame();

        function startGame() {
            resetGame();
            gameInterval = setInterval(gameLoop, 100);
        }

        function gameLoop() {
            changingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
            checkGameOver();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#4CAF50" : "#81C784";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if snake eats food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Make sure food doesn't spawn on top of the snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    generateFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function checkGameOver() {
            const head = snake[0];

            // Wall collision
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= tileCount;
            const hitToptWall = head.y < 0;
            const hitBottomWall = head.y >= tileCount;

            if (hitLeftWall || hitRightWall || hitToptWall || hitBottomWall) {
                endGame();
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            clearInterval(gameInterval);
            isGameOver = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#FF5252";
            ctx.font = "30px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#ffffff";
            ctx.font = "14px 'Courier New'";
            ctx.fillText("Press SPACEBAR to Play Again", canvas.width / 2, canvas.height / 2 + 25);
        }

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            isGameOver = false;
            generateFood();
        }

        // Handle keyboard inputs
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            // Restart game on Spacebar
            if (keyPressed === 32 && isGameOver) {
                startGame();
                return;
            }

            if (changingDirection) return;

            // Left arrow (37) or A (65)
            if ((keyPressed === 37 || keyPressed === 65) && !goingRight) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            // Up arrow (38) or W (87)
            if ((keyPressed === 38 || keyPressed === 87) && !goingDown) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            // Right arrow (39) or D (68)
            if ((keyPressed === 39 || keyPressed === 68) && !goingLeft) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            // Down arrow (40) or S (83)
            if ((keyPressed === 40 || keyPressed === 83) && !goingUp) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }
    </script>
</body>
</html>
